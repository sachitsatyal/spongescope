version: 2

models:
  - name: int_mirna_name_map
    description: miRBase mature name -> atlas column name (exact, or arm-stripped when unambiguous).
    columns:
      - name: mimat_id
        data_tests: [unique, not_null]
      - name: atlas_name
        data_tests: [not_null]
      - name: match_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['exact', 'arm_stripped']
