version: 2

models:
  - name: int_lncrna_transcripts
    description: Eligible lncRNA transcripts (main chromosomes, 200 nt to max_lncrna_length).
    columns:
      - name: transcript_id
        data_tests: [unique, not_null]

  - name: int_site_transcript_hits
    description: ENCORI binding sites matched to overlapping transcripts of the same gene.
    columns:
      - name: site_id
        data_tests: [not_null]

  - name: int_gene_representative
    description: One representative transcript per lncRNA gene (most CLIP sites, then longest).
    columns:
      - name: gene_id
        data_tests: [unique, not_null]
      - name: transcript_id
        data_tests: [unique, not_null]

  - name: int_positive_pairs
    description: CLIP-supported (lncRNA gene, miRNA) positives.
    columns:
      - name: transcript_id
        data_tests: [not_null]
      - name: mimat_id
        data_tests: [not_null]

  - name: int_negative_pairs
    description: Negatives at negative_ratio per positive, half degree-matched, half random.
    columns:
      - name: pair_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['degree_matched', 'random']
