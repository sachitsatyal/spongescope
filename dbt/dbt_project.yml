name: spongescope
version: "0.1.0"
config-version: 2
profile: spongescope

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  max_lncrna_length: 25000
  negative_ratio: 10
  seed: 42

models:
  spongescope:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
