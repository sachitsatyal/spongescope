# Classic (non-neural) baselines. Run:  uv run python -m spongescope.baselines.classic
seed: 42
paper_style: false   # true = original paper setup (random 1:1 negatives, random pair split)

paths:
  processed: data/processed
  features: data/features
  predictions: data/predictions

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment: spongescope

eval:
  n_boot: 1000

hydra:
  job:
    chdir: false
  run:
    dir: outputs/baselines/${now:%Y-%m-%d_%H-%M-%S}
