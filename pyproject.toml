[project]
name = "spongescope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sachitsatyal", email = "18736789+sachitsatyal@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.88",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "dbt-snowflake>=1.12.5",
    "duckdb>=2.0.0",
    "dvc>=3.67.1",
    "fastapi>=0.162.0",
    "hydra-core>=1.3.8",
    "lightning>=2.6.6",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "prefect>=3.8.8",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rna-fm>=0.2.2",
    "scikit-learn>=1.9.1",
    "snowflake-connector-python>=5.2.0",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
    "viennarna>=2.7.2",
]

[project.scripts]
spongescope = "spongescope:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
